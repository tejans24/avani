name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avani-site

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avani
          POSTGRES_PASSWORD: avani
          POSTGRES_DB: avani
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avani"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://avani:avani@localhost:5432/avani
      TEST_DATABASE_URL: postgresql://avani:avani@localhost:5432/avani_test
      AUTH_MODE: test
      EMAIL_MODE: fake
      ALLOWED_EMAILS: owner@example.com
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      RESEND_API_KEY: re_placeholder
      EMAIL_FROM: "Avani <invoices@example.com>"
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: avani-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: PGPASSWORD=avani psql -h localhost -U avani -d avani -c "CREATE DATABASE avani_test"

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: avani-site/playwright-report
          retention-days: 7
