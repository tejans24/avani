services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avani
      POSTGRES_PASSWORD: avani
      POSTGRES_DB: avani
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the avani_test database used by the e2e suite
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  pgdata:
